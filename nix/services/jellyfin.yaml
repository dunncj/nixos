---

apiVersion: v1

kind: Namespace

metadata:

  name: media



---

apiVersion: v1

kind: PersistentVolumeClaim

metadata:

  name: jellyfin-config

  namespace: media

spec:

  accessModes:

    - ReadWriteOnce

  resources:

    requests:

      storage: 20Gi



---

apiVersion: v1

kind: PersistentVolumeClaim

metadata:

  name: jellyfin-cache

  namespace: media

spec:

  accessModes:

    - ReadWriteOnce

  resources:

    requests:

      storage: 20Gi



---

apiVersion: apps/v1

kind: Deployment

metadata:

  name: jellyfin

  namespace: media

spec:

  replicas: 1

  selector:

    matchLabels:

      app: jellyfin

  template:

    metadata:

      labels:

        app: jellyfin

    spec:

      containers:

        - name: jellyfin

          image: jellyfin/jellyfin:latest

          imagePullPolicy: IfNotPresent



          ports:

            - containerPort: 8096



          volumeMounts:

            - name: config

              mountPath: /config



            - name: cache

              mountPath: /cache



            - name: media

              mountPath: /media

              readOnly: true



          resources:

            requests:

              cpu: 500m

              memory: 1Gi

            limits:

              cpu: "4"

              memory: 4Gi



      volumes:

        - name: config

          persistentVolumeClaim:

            claimName: jellyfin-config



        - name: cache

          persistentVolumeClaim:

            claimName: jellyfin-cache



        - name: media

          hostPath:

            path: /mnt/media

            type: Directory



---

apiVersion: v1

kind: Service

metadata:

  name: jellyfin

  namespace: media

spec:

  selector:

    app: jellyfin

  ports:

    - port: 8096

      targetPort: 8096

      protocol: TCP

  type: ClusterIP



---

apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: jellyfin

  namespace: media

spec:

  ingressClassName: traefik

  rules:

    - host: jellyfin.agartha.sh

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: jellyfin

                port:

                  number: 8096
